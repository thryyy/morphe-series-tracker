name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: series-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'thryyy/morphe-series-tracker'
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check release metadata
        run: node --test .github/scripts/bundle-metadata.test.cjs

      - name: Prepare public build inputs
        run: python3 scripts/bootstrap.py

      - name: Validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:checkStringResources :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Series Tracker ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: .local/release-assets/*.mpp
