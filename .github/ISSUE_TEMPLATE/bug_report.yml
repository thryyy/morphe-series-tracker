name: Bug report
description: Report a problem with Series Tracker.
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the steps to reproduce and what you expected.
    validations:
      required: true
  - type: input
    attributes:
      label: Versions
      description: Series Tracker bundle, YouTube, Morphe and Android versions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant error
      description: Include a short error excerpt if available. Remove account details and tokens.
